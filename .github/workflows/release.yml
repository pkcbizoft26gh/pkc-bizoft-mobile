name: Release APK

# Pushing a version tag (for example v0.1.6(BETA)) builds the Android APK in
# the cloud and attaches it to a GitHub release as app-release.apk.
# The website downloads it from .../releases/latest/download/app-release.apk,
# so the file name must stay exactly app-release.apk.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # .env is gitignored. The Supabase URL and publishable key in
      # .env.example are the same public values that ship inside the app.
      # Never put a service-role key in this file.
      - name: Create .env
        run: cp .env.example .env

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --console=plain

      - name: Prepare APK
        run: cp android/app/build/outputs/apk/release/app-release.apk app-release.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: app-release.apk
          generate_release_notes: true
          # Must stay false: GitHub's "latest" release ignores pre-releases,
          # which would break the website's download link.
          prerelease: false
